about:
  en: "I'm researching data-oriented recursive self-improvement: how AI systems can turn real-world experience into better training tasks, executable environments, and reliable benchmarks. At ByteDance, I work on agent evaluation, verification, and LLM post-training. My research connects how agents learn with how we measure their progress, from discovering useful tasks and learning from failures to verifying that improvements translate into reliable capabilities."
  zh: 我研究面向数据的递归自我改进（data-oriented recursive self-improvement）：AI 系统怎样把真实世界里的经验，变成更好的训练任务、可执行环境和可靠的 benchmark。在字节跳动，我做 Agent 评测、verification 和 LLM post-training。我的研究把 Agent 怎么学和我们怎么衡量它的进步连在一起：从发现有用的任务、从失败中学习，到验证这些改进确实变成了可靠的能力。

